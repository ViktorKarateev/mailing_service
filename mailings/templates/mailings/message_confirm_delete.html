{% extends 'mailings/base.html' %}

{% block content %}
<h1>Удаление сообщения</h1>
<p>Вы уверены, что хотите удалить сообщение <strong>{{ object.subject }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a class="btn btn-secondary" href="{% url 'mailings:message_list' %}">Отмена</a>
</form>
{% endblock %}
