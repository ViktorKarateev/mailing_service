{% extends 'mailings/base.html' %}

{% block content %}
<h1 class="mb-4">Рассылки</h1>
<a class="btn btn-success mb-3" href="{% url 'mailings:mailing_create' %}">Создать рассылку</a>

<ul class="list-group">
  {% for mailing in object_list %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <div>
        <a href="{% url 'mailings:mailing_detail' mailing.pk %}">
          {{ mailing.message.subject }} — {{ mailing.status }}
        </a>
      </div>
      <div>
        <a href="{% url 'mailings:mailing_update' mailing.pk %}" class="btn btn-sm btn-outline-primary">Редактировать</a>
        <a href="{% url 'mailings:mailing_delete' mailing.pk %}" class="btn btn-sm btn-outline-danger">Удалить</a>
      </div>
    </li>
  {% empty %}
    <li class="list-group-item">Рассылок пока нет.</li>
  {% endfor %}
</ul>
{% endblock %}
