{% extends 'mailings/base.html' %}

{% block content %}
<h1 class="mb-4">Удаление клиента</h1>
<p>Вы уверены, что хотите удалить клиента <strong>{{ object.full_name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a class="btn btn-secondary" href="{% url 'mailings:client_list' %}">Отмена</a>
</form>
{% endblock %}
