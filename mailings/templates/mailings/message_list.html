{% extends 'mailings/base.html' %}

{% block content %}
<h1>Сообщения</h1>
<a class="btn btn-primary mb-3" href="{% url 'mailings:message_create' %}">Создать сообщение</a>

<ul class="list-group">
  {% for message in object_list %}
    <li class="list-group-item">
      <a href="{% url 'mailings:message_detail' message.pk %}">{{ message.subject }}</a>
    </li>
  {% empty %}
    <li class="list-group-item">Нет сообщений</li>
  {% endfor %}
</ul>
{% endblock %}
