{% extends 'base.html' %}

{% block content %}
  <div class="container mt-4">
    <h2>{% if object %}Редактировать сообщение{% else %}Создать сообщение{% endif %}</h2>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">
        {% if object %}Сохранить изменения{% else %}Создать{% endif %}
      </button>
      <a href="{% url 'mailings:message_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
  </div>
{% endblock %}
