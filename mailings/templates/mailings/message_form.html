{% extends 'mailings/base.html' %}

{% block content %}
<h1>{% if object %}Редактировать сообщение{% else %}Создать сообщение{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Сохранить</button>
  <a class="btn btn-secondary" href="{% url 'mailings:message_list' %}">Отмена</a>
</form>
{% endblock %}
