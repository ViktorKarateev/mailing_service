{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">{{ view.object.pk|yesno:"Редактирование клиента,Создание клиента" }}</h1>

<form method="post" class="needs-validation" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a class="btn btn-secondary" href="{% url 'mailings:client_list' %}">Назад</a>
</form>
{% endblock %}
